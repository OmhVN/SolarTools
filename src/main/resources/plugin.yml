name: SolarTool
version: '${project.version}'
main: com.omhvn.tools.SolarTool
api-version: '1.21'
folia-supported: true
authors: [OmhVN]
description: SolarTool tools plugin with custom tools.
softdepend: [WorldGuard]
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.slf4j:slf4j-api:2.0.9
  - org.slf4j:slf4j-simple:2.0.9
  - org.xerial:sqlite-jdbc:3.45.1.0
  - com.mysql:mysql-connector-j:8.3.0
commands:
  givetools:
    description: Gives custom SolarTool tools to players
    usage: /<command> <tool> [player] [amount]
    permission: solartools.admin
  solartool:
    description: SolarTool admin commands
    usage: /<command> reload
    permission: solartools.admin
  tool:
    description: Opens the GUI to get custom tools
    usage: /<command>
    role: admin
    permission: solartools.admin

permissions:
  solartools.admin:
    description: Allows access to admin commands
    default: op
  solartools.use:
    description: Allows usage of tools
    default: true

