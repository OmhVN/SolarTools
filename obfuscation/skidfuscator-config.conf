exempt: [
  # Exempt third-party plugins/libs if they ever get shaded in the future
  "class{^com\\/sk89q\\/}",
  "class{^com\\/zaxxer\\/}",
  "class{^org\\/sqlite\\/}",
  "class{^org\\/slf4j\\/}",
  "class{^com\\/omhvn\\/tools\\/bstats\\/}"
]

libs: [
  "./obfuscation/libs/paper-api.jar",
  "./obfuscation/libs/worldguard-bukkit.jar",
  "./obfuscation/libs/worldedit-bukkit.jar",
  "./obfuscation/libs/HikariCP-5.1.0.jar",
  "./obfuscation/libs/sqlite-jdbc-3.45.1.0.jar",
  "./obfuscation/libs/slf4j-api-2.0.9.jar"
]

# ── String encryption ─────────────────────────────────────────────────
stringEncryption {
  type: STANDARD
  enabled: true
  exempt: []
}

# ── Number encryption ─────────────────────────────────────────────────
numberEncryption {
  enabled: true
  exempt: []
}

# ── Flow: condition ───────────────────────────────────────────────────
flowCondition {
  enabled: true
  exempt: []
}

# ── Flow: exception ───────────────────────────────────────────────────
flowException {
  enabled: true
  strength: WEAK
  exempt: []
}

# ── Flow: range ───────────────────────────────────────────────────────
flowRange {
  enabled: true
  exempt: []
}

# ── Flow: switch ──────────────────────────────────────────────────────
flowSwitch {
  enabled: true
  exempt: []
}

# ── Flow: factory maker ───────────────────────────────────────────────
flowFactoryMaker {
  enabled: true
}

# ── Outliner ──────────────────────────────────────────────────────────
outliner {
  enabled: true
  exempt: []
}

# ── Ahegao ────────────────────────────────────────────────────────────
ahegao {
  enabled: false
  exempt: []
}

# ── Misc ──────────────────────────────────────────────────────────────
exceptionReturn  { enabled: true }

# We disabled renamers here because ProGuard already handles class, method,
# and field renaming cleanly.
classRenamer     { enabled: false }
methodRenamer    { enabled: false }
fieldRenamer     { enabled: false }

driver           { enabled: false }
native           { enabled: false }
reference        { enabled: true }
fileCrasher      { enabled: false }